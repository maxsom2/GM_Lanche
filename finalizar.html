<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#08080b"><title>Finalizar pedido | GM Lanches</title><link rel="icon" href="assets/logo-gm-lanches-oficial.jpg" type="image/jpeg"><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="js/config.js"></script><script defer src="js/supabase-client.js"></script><script defer src="js/db-queries.js"></script><script defer src="js/layout.js"></script><script defer src="js/checkout.js"></script></head>
<body><div id="site-header"></div><main class="container page-main"><div class="page-heading"><span class="eyebrow">QUASE LÁ</span><h1>Finalizar pedido</h1><p>Informe seus dados e escolha como deseja receber e pagar.</p></div><div id="checkout-notice" class="notice" hidden></div><form id="checkout-form" class="form-card checkout-grid" novalidate>
  <section><h2>Seus dados</h2><label>Nome completo<input name="name" autocomplete="name" required minlength="2" maxlength="120"></label><label>Telefone com DDD<input name="phone" autocomplete="tel" inputmode="tel" placeholder="(65) 99999-9999" required></label><label>E-mail (opcional)<input name="email" type="email" autocomplete="email"></label>
  <h2>Recebimento</h2><div class="radio-row"><label class="radio-card"><input type="radio" name="order_type" value="pickup" checked><span><strong>Retirada</strong><small>Buscar no local</small></span></label><label class="radio-card"><input type="radio" name="order_type" value="delivery"><span><strong>Entrega</strong><small>Receber no endereço</small></span></label></div><div id="delivery-fields" hidden><label>Bairro<select name="neighborhood_id"><option value="">Selecione seu bairro</option></select></label><label>Endereço completo<textarea name="address" rows="3" placeholder="Rua, número, complemento e referência"></textarea></label></div>
  <h2>Pagamento presencial</h2><div class="radio-row payment-options"><label class="radio-card"><input type="radio" name="payment_method" value="pix" checked><span><strong>Pix</strong><small>Pagamento presencial</small></span></label><label class="radio-card"><input type="radio" name="payment_method" value="cash"><span><strong>Dinheiro</strong><small>Na retirada/entrega</small></span></label><label class="radio-card"><input type="radio" name="payment_method" value="card_machine"><span><strong>Cartão</strong><small>Na maquininha</small></span></label></div><label>Observações do pedido (opcional)<textarea name="notes" rows="3" maxlength="500" placeholder="Alguma informação para a equipe?"></textarea></label><button class="btn btn-primary btn-wide" type="submit" id="submit-order">Enviar pedido</button><p class="form-help">O pagamento é feito presencialmente. Não há cobrança online neste site.</p></section>
  <aside class="order-summary"><h2>Resumo</h2><div id="checkout-summary"></div></aside>
</form><div id="order-success" class="success-panel" hidden aria-live="polite"></div></main><div id="site-footer"></div></body></html>
