<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#08080b"><title>Minha conta | GM Lanches</title><link rel="icon" href="assets/logo-gm-lanches-oficial.jpg" type="image/jpeg"><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="js/config.js"></script><script defer src="js/supabase-client.js"></script><script defer src="js/db-queries.js"></script><script defer src="js/layout.js"></script><script defer src="js/account.js"></script></head>
<body><div id="site-header"></div><main class="container page-main narrow-page"><div class="page-heading"><span class="eyebrow">OPCIONAL</span><h1>Minha conta</h1><p>Você pode pedir como visitante. A conta é opcional e serve para consultar seus dados e histórico.</p></div><div id="account-message" class="notice" hidden></div><div id="auth-panels" class="account-grid"><form id="signup-form" class="form-card"><h2>Criar conta</h2><label>Nome completo<input name="full_name" autocomplete="name" required></label><label>Telefone<input name="phone" autocomplete="tel" required></label><label>E-mail<input name="email" type="email" autocomplete="email" required></label><label>Senha<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><button class="btn btn-primary btn-wide" type="submit">Criar conta</button></form><form id="login-form" class="form-card"><h2>Entrar</h2><label>E-mail<input name="email" type="email" autocomplete="email" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button class="btn btn-ghost btn-wide" type="submit">Entrar na conta</button></form></div><section id="account-dashboard" class="form-card" hidden><div class="section-heading"><h2>Seus dados</h2><button id="logout-button" class="btn btn-small btn-ghost" type="button">Sair</button></div><form id="profile-form"><label>Nome completo<input name="full_name" required></label><label>Telefone<input name="phone"></label><label>E-mail<input name="email" type="email" disabled></label><button class="btn btn-primary" type="submit">Salvar dados</button></form><h2>Histórico de pedidos</h2><div id="account-orders"></div><h2 style="margin-top:28px">Endereços salvos</h2><form id="saved-address-form"><label>Identificação<input name="label" maxlength="50" placeholder="Casa, trabalho…"></label><label>Bairro<select name="neighborhood_id" required><option value="">Selecione</option></select></label><div class="account-grid"><label>Rua<input name="street" required></label><label>Número<input name="street_number" required></label></div><label>Complemento<input name="complement"></label><label>Ponto de referência<input name="reference_point"></label><label>CEP<input name="postal_code" inputmode="numeric"></label><label class="checkline"><input type="checkbox" name="is_default"> Definir como endereço principal</label><button class="btn btn-primary" type="submit">Salvar endereço</button></form><div id="saved-addresses"></div></section></main><div id="site-footer"></div></body></html>
